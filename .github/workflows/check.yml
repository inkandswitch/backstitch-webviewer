name: 🔎 Run Tests and Lint

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7

      - name: Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test

      - name: 📋 Format
        run: npx oxfmt --check .

      - name: 🧹 Lint
        run: npm run lint

[build]
command = "VITE_BACKSTITCH_API_URL=\"/api\" npm run build"
publish = "dist"

[[headers]]
for = "/*"
[headers.values]
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Embedder-Policy = "require-corp"

[[redirects]]
from = "/api/*"
to = "https://alpha.backstitch.dev/:splat"
status = 200
force = true

